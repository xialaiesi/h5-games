<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>五子棋</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #eee;
  overflow: hidden;
  touch-action: manipulation;
}

h1 {
  font-size: 28px;
  margin-bottom: 12px;
  font-weight: 300;
  letter-spacing: 4px;
  color: #e0c080;
}

.info-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 12px;
  font-size: 16px;
  height: 36px;
}

.player-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 16px;
  border-radius: 20px;
  transition: all 0.3s;
}

.player-indicator.active {
  background: rgba(224, 192, 128, 0.2);
  box-shadow: 0 0 12px rgba(224, 192, 128, 0.3);
}

.stone-icon {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: inline-block;
}

.stone-icon.black {
  background: radial-gradient(circle at 35% 35%, #555, #111);
  box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
}

.stone-icon.white {
  background: radial-gradient(circle at 35% 35%, #fff, #bbb);
  box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
}

#board-container {
  position: relative;
  touch-action: none;
}

canvas {
  display: block;
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.btn-row {
  display: flex;
  gap: 12px;
  margin-top: 16px;
}

button {
  padding: 8px 24px;
  border: 1px solid rgba(224, 192, 128, 0.4);
  background: rgba(224, 192, 128, 0.1);
  color: #e0c080;
  font-size: 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 2px;
}

button:hover {
  background: rgba(224, 192, 128, 0.25);
}

button:active {
  transform: scale(0.96);
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 10;
  align-items: center;
  justify-content: center;
}

.modal-overlay.show {
  display: flex;
}

.modal {
  background: #16213e;
  border: 1px solid rgba(224, 192, 128, 0.3);
  border-radius: 16px;
  padding: 32px 48px;
  text-align: center;
  animation: popIn 0.3s ease;
}

@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal h2 {
  font-size: 24px;
  color: #e0c080;
  margin-bottom: 8px;
  font-weight: 400;
  letter-spacing: 2px;
}

.modal p {
  font-size: 16px;
  color: #aaa;
  margin-bottom: 20px;
}

.modal button {
  min-width: 120px;
}

.score-board {
  font-size: 13px;
  color: #888;
  margin-bottom: 4px;
  letter-spacing: 1px;
}
</style>
</head>
<body>

<h1>五 子 棋</h1>
<div class="score-board" id="score-board"></div>
<div class="info-bar">
  <div class="player-indicator active" id="ind-black">
    <span class="stone-icon black"></span>
    <span>黑棋</span>
  </div>
  <span style="color:#555">VS</span>
  <div class="player-indicator" id="ind-white">
    <span class="stone-icon white"></span>
    <span>白棋</span>
  </div>
</div>

<div id="board-container">
  <canvas id="board"></canvas>
</div>

<div class="btn-row">
  <button id="btn-undo">悔 棋</button>
  <button id="btn-restart">重 开</button>
  <button id="btn-mode">模式: 双人</button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">黑棋胜!</h2>
    <p id="modal-subtitle">恭喜获胜</p>
    <button id="btn-modal-restart">再来一局</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
