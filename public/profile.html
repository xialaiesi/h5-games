<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的烧烤摊</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-logo-link" href="/index.html" aria-label="返回首页">
      <span class="navbar-brand-mark" aria-hidden="true">
        <img src="/bbq/assets/grill.png" alt="" width="320" height="320">
      </span>
      <span class="navbar-logo">烧烤摊<span>ACCOUNT</span></span>
    </a>
    <div class="navbar-actions">
      <button class="btn btn-ghost btn-sm" id="btn-logout" type="button">退出</button>
    </div>
  </div>
</nav>

<div class="profile-header">
  <div class="profile-header-media">
    <img src="/bbq/assets/bg.jpg" alt="夜市烧烤背景" width="800" height="1735" loading="eager">
  </div>
  <div class="profile-header-content">
    <div class="profile-avatar" id="profile-avatar">摊</div>
    <div class="profile-nickname" id="profile-nickname">
      <span class="skeleton" style="width:110px;height:26px;display:inline-block"></span>
    </div>
    <div class="profile-email" id="profile-email"></div>
    <div class="profile-rank-row" id="profile-rank"></div>
    <div class="profile-since" id="profile-since"></div>
  </div>
</div>

<main class="page">
  <div class="page-content profile-page">
    <section class="home-section">
      <div class="section-title">账号资料</div>
      <div class="card profile-panel">
        <div class="profile-inline-editor">
          <input type="text" class="form-input" id="nickname-input" placeholder="修改昵称" maxlength="12" autocomplete="nickname">
          <button class="btn btn-outline btn-sm" id="btn-save-nick" type="button">保存</button>
        </div>
      </div>
    </section>

    <section class="home-section">
      <div class="section-title">烧烤档案</div>
      <div class="card profile-panel">
        <div class="profile-meta-row">
          <div>
            <div class="profile-meta-key">当前进度</div>
            <div class="profile-meta-value text-gold" id="bbq-level-text">第1关</div>
          </div>
          <div class="profile-meta-key" id="bbq-last-played">尚未开烤</div>
        </div>
        <div class="stat-grid">
          <div class="stat-cell">
            <div class="stat-cell-value" id="bbq-score">0</div>
            <div class="stat-cell-label">累计积分</div>
          </div>
          <div class="stat-cell">
            <div class="stat-cell-value text-gold" id="bbq-coins">0</div>
            <div class="stat-cell-label">金币</div>
          </div>
          <div class="stat-cell">
            <div class="stat-cell-value" id="bbq-stars">0</div>
            <div class="stat-cell-label">星数</div>
          </div>
        </div>
      </div>
    </section>

    <section class="home-section">
      <div class="section-title">安全设置</div>
      <div class="card profile-panel">
        <div class="password-form">
          <input type="password" class="form-input" id="current-password-input" placeholder="当前密码" autocomplete="current-password">
          <input type="password" class="form-input" id="new-password-input" placeholder="新密码（至少 6 位）" autocomplete="new-password">
          <input type="password" class="form-input" id="confirm-password-input" placeholder="确认新密码" autocomplete="new-password">
          <button class="btn btn-gold btn-block" id="btn-change-password" type="button">更新密码</button>
        </div>
      </div>
    </section>
  </div>
</main>

<nav class="bottom-nav" aria-label="主导航">
  <a class="bottom-nav-item" href="/index.html">
    <span class="bottom-nav-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 11.5L12 5l8 6.5V20H4v-8.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M9 20v-5h6v5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </span>
    <span>首页</span>
  </a>
  <a class="bottom-nav-item active" href="/profile.html" aria-current="page">
    <span class="bottom-nav-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 12a4 4 0 100-8 4 4 0 000 8z" stroke="currentColor" stroke-width="1.8"/>
        <path d="M5 20a7 7 0 0114 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </span>
    <span>我的</span>
  </a>
</nav>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script>
(function () {
  'use strict';

  if (!Auth.requireAuth()) return;

  const user = Auth.getUser();

  document.getElementById('btn-logout').addEventListener('click', async () => {
    const ok = await UI.confirm({
      title: '退出登录',
      message: '确认离开你的摊位吗？',
      confirmText: '退出',
      cancelText: '取消',
      danger: true,
    });
    if (!ok) return;

    try { await API.auth.logout(); } catch (_) {}
    Auth.clearAuth();
    location.href = '/login.html';
  });

  function maskPhone(phone) {
    const raw = String(phone || '');
    return raw.length === 11 ? `${raw.slice(0, 3)}****${raw.slice(-4)}` : raw;
  }

  function renderBasicInfo(data) {
    const nickname = data.nickname || '未知用户';
    const account = data.phone ? `手机号 ${maskPhone(data.phone)}` : (data.email || '');
    document.getElementById('profile-nickname').textContent = nickname;
    document.getElementById('profile-email').textContent = account;
    document.getElementById('profile-since').textContent =
      (data.createdAt || data.created_at) ? '注册于 ' + UI.formatDate(data.createdAt || data.created_at) : '';
    document.getElementById('nickname-input').value = nickname;
    document.getElementById('profile-avatar').textContent = nickname.charAt(0).toUpperCase();
  }

  function renderBBQ(data) {
    const bbq = data && data.bbq ? data.bbq : {};
    const maxLevel = bbq.maxLevel || 1;
    const totalScore = bbq.totalScore || 0;
    const coins = (bbq.resources && bbq.resources.coins) || 0;
    const levelStars = bbq.levelStars || {};
    const starCount = Object.values(levelStars).reduce((sum, val) => sum + (parseInt(val, 10) || 0), 0);
    const hasPlayed = totalScore > 0 || starCount > 0 || maxLevel > 1;

    document.getElementById('bbq-level-text').textContent = `第${maxLevel}关`;
    document.getElementById('bbq-score').textContent = totalScore;
    document.getElementById('bbq-coins').textContent = coins;
    document.getElementById('bbq-stars').textContent = starCount;
    document.getElementById('profile-rank').innerHTML =
      `<span class="status-chip">第 ${maxLevel} 关 · 金币 ${coins}</span>`;
    document.getElementById('bbq-last-played').textContent = hasPlayed && bbq.lastPlayed
      ? '最近游玩 ' + UI.formatTime(bbq.lastPlayed)
      : '尚未开烤';
  }

  document.getElementById('btn-save-nick').addEventListener('click', async () => {
    const nickname = document.getElementById('nickname-input').value.trim();
    if (!nickname || nickname.length < 2) {
      UI.toast('昵称至少 2 个字符', 'warning');
      return;
    }
    if (nickname.length > 12) {
      UI.toast('昵称最多 12 个字符', 'warning');
      return;
    }

    const btn = document.getElementById('btn-save-nick');
    btn.disabled = true;
    try {
      const res = await API.users.updateMe({ nickname });
      Auth.updateUser({ nickname: res.nickname || nickname });
      document.getElementById('profile-nickname').textContent = res.nickname || nickname;
      document.getElementById('profile-avatar').textContent = (res.nickname || nickname).charAt(0).toUpperCase();
      UI.toast('昵称已更新', 'success');
    } catch (err) {
      UI.toast(err.message || '保存失败', 'error');
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('btn-change-password').addEventListener('click', async () => {
    const currentPassword = document.getElementById('current-password-input').value;
    const newPassword = document.getElementById('new-password-input').value;
    const confirmPassword = document.getElementById('confirm-password-input').value;

    if (!currentPassword) {
      UI.toast('请输入当前密码', 'warning');
      return;
    }
    if (!newPassword || newPassword.length < 6) {
      UI.toast('新密码至少需要 6 位', 'warning');
      return;
    }
    if (newPassword !== confirmPassword) {
      UI.toast('两次输入的新密码不一致', 'warning');
      return;
    }

    const btn = document.getElementById('btn-change-password');
    btn.disabled = true;
    btn.textContent = '更新中...';

    try {
      const res = await API.auth.changePassword({ currentPassword, newPassword });
      document.getElementById('current-password-input').value = '';
      document.getElementById('new-password-input').value = '';
      document.getElementById('confirm-password-input').value = '';
      UI.toast(res.message || '密码已更新', 'success');
    } catch (err) {
      UI.toast(err.message || '密码更新失败', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '更新密码';
    }
  });

  async function loadProfile() {
    try {
      UI.showLoading('加载中...');
      const meData = await API.users.me();
      renderBasicInfo(meData);
      renderBBQ(meData);
    } catch (err) {
      UI.toast('加载失败：' + (err.message || '请重试'), 'error');
      if (user) {
        renderBasicInfo(user);
        renderBBQ(user);
      }
    } finally {
      UI.hideLoading();
    }
  }

  loadProfile();
})();
</script>
</body>
</html>
