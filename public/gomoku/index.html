<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>五子棋</title>
<style>
/* ==================== 对局页私有样式（不依赖外部CSS，保持独立） ==================== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #e0c080;
  --bg: #1a1a2e;
  --bg-card: #16213e;
  --border: rgba(224,192,128,0.2);
  --text-muted: #888;
  --success: #50c878;
  --danger: #e05050;
  --warning: #f0a030;
}

body {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  color: #eee;
  touch-action: manipulation;
  overflow-x: hidden;
}

/* ===== 顶部标题（单机模式） ===== */
#offline-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 16px;
}

h1 {
  font-size: 28px;
  margin-bottom: 6px;
  font-weight: 300;
  letter-spacing: 4px;
  color: var(--gold);
}

.score-board {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 4px;
  letter-spacing: 1px;
}

/* ===== 玩家状态栏（在线模式顶部/底部） ===== */
.player-bar-online {
  width: 100%;
  max-width: 520px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin: 4px 12px;
  transition: border-color 0.25s, box-shadow 0.25s;
}

.player-bar-online.active {
  border-color: rgba(224,192,128,0.5);
  box-shadow: 0 0 12px rgba(224,192,128,0.12);
}

.player-bar-name {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.player-bar-rating { font-size: 12px; color: var(--text-muted); }

.player-bar-timer {
  font-size: 16px;
  font-weight: 700;
  color: var(--gold);
  min-width: 32px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.player-bar-timer.warning { color: var(--warning); }
.player-bar-timer.danger  { color: var(--danger); animation: timer-pulse 0.5s infinite; }

@keyframes timer-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}

/* ===== 棋子颜色标记 ===== */
.stone-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
}

.stone-dot.black { background: radial-gradient(circle at 35% 35%, #555, #111); }
.stone-dot.white { background: radial-gradient(circle at 35% 35%, #fff, #bbb); }

/* ===== 回合指示条（单机） ===== */
.info-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 8px;
  font-size: 16px;
  height: 36px;
}

.player-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 16px;
  border-radius: 20px;
  transition: all 0.3s;
}

.player-indicator.active {
  background: rgba(224,192,128,0.18);
  box-shadow: 0 0 12px rgba(224,192,128,0.25);
}

.stone-icon {
  width: 20px; height: 20px;
  border-radius: 50%;
  display: inline-block;
}

.stone-icon.black { background: radial-gradient(circle at 35% 35%, #555, #111); box-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
.stone-icon.white { background: radial-gradient(circle at 35% 35%, #fff, #bbb); box-shadow: 1px 1px 3px rgba(0,0,0,0.3); }

/* ===== 棋盘 ===== */
#board-container { position: relative; touch-action: none; padding: 8px 12px; }

canvas {
  display: block;
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

/* ===== 操作按钮 ===== */
.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 0 12px 16px;
}

button {
  padding: 8px 20px;
  border: 1px solid rgba(224,192,128,0.35);
  background: rgba(224,192,128,0.08);
  color: var(--gold);
  font-size: 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
  font-family: inherit;
}

button:hover  { background: rgba(224,192,128,0.2); }
button:active { transform: scale(0.96); }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

button.danger {
  border-color: rgba(224,80,80,0.4);
  background: rgba(224,80,80,0.1);
  color: #ff8888;
}

/* ===== 在线操作按钮 ===== */
#online-controls { display: none; }

/* ===== 结果弹窗 ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 10;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--bg-card);
  border: 1px solid rgba(224,192,128,0.3);
  border-radius: 16px;
  padding: 32px 40px;
  text-align: center;
  animation: popIn 0.3s ease;
  max-width: 320px;
  width: calc(100% - 32px);
}

@keyframes popIn {
  from { transform: scale(0.82); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}

.modal h2 {
  font-size: 24px;
  color: var(--gold);
  margin-bottom: 8px;
  font-weight: 400;
  letter-spacing: 2px;
}

.modal p { font-size: 15px; color: var(--text-muted); margin-bottom: 20px; }

.modal .modal-delta {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
}

.modal .modal-delta.positive { color: var(--success); }
.modal .modal-delta.negative { color: var(--danger); }

.modal button { min-width: 110px; }

/* ===== 和棋/悔棋提示弹窗 ===== */
.offer-modal {
  display: none;
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  z-index: 20;
  width: calc(100% - 32px);
  max-width: 360px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  animation: slideUp 0.25s ease;
}

@keyframes slideUp {
  from { transform: translateX(-50%) translateY(20px); opacity: 0; }
  to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
}

.offer-modal.show { display: block; }
.offer-modal-title { font-size: 14px; color: var(--gold); margin-bottom: 12px; text-align:center; }
.offer-modal-btns  { display: flex; gap: 10px; }
.offer-modal-btns button { flex: 1; }

/* ===== 对手掉线提示 ===== */
#disconnect-banner {
  display: none;
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(240,160,48,0.15);
  border: 1px solid rgba(240,160,48,0.4);
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 13px;
  color: var(--warning);
  z-index: 30;
  text-align: center;
  width: calc(100% - 32px);
  max-width: 360px;
}

#disconnect-banner.show { display: block; }
</style>
</head>
<body>

<!-- ===== 对手信息（在线模式，顶部） ===== -->
<div id="online-header" style="display:none;width:100%;max-width:520px;padding:6px 12px 0">
  <div class="player-bar-online" id="bar-opponent">
    <div class="stone-dot" id="opponent-stone"></div>
    <div style="flex:1">
      <div class="player-bar-name" id="opponent-name">对手</div>
      <div class="player-bar-rating" id="opponent-rating"></div>
    </div>
    <div class="player-bar-timer" id="opponent-timer">--</div>
  </div>
</div>

<!-- ===== 对手掉线提示 ===== -->
<div id="disconnect-banner">
  对手已断线，等待重连... <span id="disconnect-countdown"></span>
</div>

<!-- ===== 单机标题 ===== -->
<div id="offline-header">
  <h1>五 子 棋</h1>
  <div class="score-board" id="score-board"></div>
  <div class="info-bar">
    <div class="player-indicator active" id="ind-black">
      <span class="stone-icon black"></span><span>黑棋</span>
    </div>
    <span style="color:#555">VS</span>
    <div class="player-indicator" id="ind-white">
      <span class="stone-icon white"></span><span>白棋</span>
    </div>
  </div>
</div>

<!-- ===== 棋盘 ===== -->
<div id="board-container">
  <canvas id="board"></canvas>
</div>

<!-- ===== 单机操作按钮 ===== -->
<div class="btn-row" id="offline-controls">
  <button id="btn-undo">悔 棋</button>
  <button id="btn-restart">重 开</button>
  <button id="btn-mode">模式: 双人</button>
  <button id="btn-hall" onclick="history.length>1?history.back():location.href='/gomoku/hall.html'"
    style="font-size:12px;padding:6px 14px;opacity:0.6">返回大厅</button>
</div>

<!-- ===== 在线操作按钮 ===== -->
<div class="btn-row" id="online-controls">
  <button id="btn-resign" class="danger">认 输</button>
  <button id="btn-draw-offer">请求和棋</button>
  <button id="btn-online-back" onclick="location.href='/gomoku/hall.html'"
    style="font-size:12px;padding:6px 14px;opacity:0.6">退出</button>
</div>

<!-- ===== 我方信息（在线模式，底部） ===== -->
<div id="online-footer" style="display:none;width:100%;max-width:520px;padding:0 12px 8px">
  <div class="player-bar-online" id="bar-self">
    <div class="stone-dot" id="self-stone"></div>
    <div style="flex:1">
      <div class="player-bar-name" id="self-name">我</div>
      <div class="player-bar-rating" id="self-rating"></div>
    </div>
    <div class="player-bar-timer" id="self-timer">--</div>
  </div>
</div>

<!-- ===== 结果弹窗 ===== -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-subtitle"></p>
    <div class="modal-delta hidden" id="modal-delta"></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button id="btn-modal-restart">再来一局</button>
      <button id="btn-modal-hall" onclick="location.href='/gomoku/hall.html'">返回大厅</button>
    </div>
  </div>
</div>

<!-- ===== 和棋提示弹窗 ===== -->
<div class="offer-modal" id="draw-offer-modal">
  <div class="offer-modal-title">对手请求和棋</div>
  <div class="offer-modal-btns">
    <button id="btn-draw-reject" class="danger">拒绝</button>
    <button id="btn-draw-accept">接受</button>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ws.js"></script>
<script src="/js/ui.js"></script>
<script src="game.js"></script>
</body>
</html>
