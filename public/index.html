<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>疯狂烧烤摊</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
<style>
  /* 首页专属样式 */
  .home-hero {
    padding: 24px 0 8px;
    text-align: center;
  }

  .home-hero-title {
    font-size: 32px;
    font-weight: 800;
    color: var(--color-gold);
    letter-spacing: 8px;
    margin-bottom: 4px;
  }

  .home-hero-sub {
    font-size: 13px;
    color: var(--color-text-muted);
    letter-spacing: 2px;
  }

  /* 用户状态条 */
  .user-status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--color-bg-card);
    border: 1px solid var(--color-border);
    border-radius: var(--border-radius-sm);
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--color-text-muted);
  }

  .user-status-bar.logged {
    color: var(--color-text);
  }

  .user-status-name {
    font-weight: 600;
    color: var(--color-gold);
    font-size: 15px;
  }

  .user-status-rating {
    color: var(--color-text-muted);
    font-size: 12px;
  }

  .home-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .summary-item {
    padding: 14px 12px;
    background: var(--color-bg-card);
    border: 1px solid var(--color-border);
    border-radius: var(--border-radius-sm);
    text-align: center;
  }

  .summary-value {
    display: block;
    font-size: 18px;
    font-weight: 700;
    color: var(--color-gold);
    margin-bottom: 4px;
  }

  .summary-label {
    font-size: 12px;
    color: var(--color-text-muted);
  }

  /* 底部导航 */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(15,15,26,0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--color-border);
    display: flex;
    z-index: 50;
  }

  .bottom-nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 0;
    font-size: 11px;
    color: var(--color-text-muted);
    cursor: pointer;
    transition: color var(--transition-fast);
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
  }

  .bottom-nav-item.active { color: var(--color-gold); }

  .bottom-nav-icon { font-size: 22px; line-height: 1; }
</style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="navbar">
  <div class="navbar-inner">
    <div class="navbar-logo">烧烤摊<span>BBQ</span></div>
    <div class="navbar-actions" id="nav-actions">
      <!-- 动态渲染：登录/注册 或 用户名+退出 -->
    </div>
  </div>
</nav>

<!-- 主内容 -->
<div class="page">
  <div class="page-content">

    <!-- Hero 标题 -->
    <div class="home-hero">
      <div class="home-hero-title">烧 烤 摊</div>
      <div class="home-hero-sub">登录后自动同步你的闯关进度</div>
    </div>

    <!-- 用户状态条（登录后显示） -->
    <div class="user-status-bar" id="user-status-bar" style="display:none">
      <span class="online-dot"></span>
      <span id="status-name" class="user-status-name"></span>
      <span id="status-rank"></span>
      <span style="flex:1"></span>
      <span id="status-rating" class="user-status-rating"></span>
    </div>

    <!-- 游戏入口 -->
    <div class="home-section">
      <div class="section-title">开始营业</div>
      <div class="game-cards">
        <div class="game-card game-card-wide card-clickable" id="card-bbq">
          <div class="game-card-icon">🔥</div>
          <div class="game-card-copy">
            <div class="game-card-name">疯狂烧烤摊</div>
            <div class="game-card-online" id="bbq-entry-status">单机闯关 · 账号存档</div>
          </div>
          <div class="game-card-arrow">进入 →</div>
        </div>
      </div>
    </div>

    <div class="home-section">
      <div class="section-title">存档概览</div>
      <div class="home-summary">
        <div class="summary-item">
          <span class="summary-value" id="home-level">第1关</span>
          <span class="summary-label">当前进度</span>
        </div>
        <div class="summary-item">
          <span class="summary-value" id="home-score">0</span>
          <span class="summary-label">累计积分</span>
        </div>
        <div class="summary-item">
          <span class="summary-value" id="home-coins">0</span>
          <span class="summary-label">金币</span>
        </div>
      </div>
    </div>

  </div><!-- /page-content -->
</div><!-- /page -->

<!-- 底部导航 -->
<nav class="bottom-nav">
  <a class="bottom-nav-item active" href="/index.html">
    <span class="bottom-nav-icon">&#x1F3E0;</span>
    <span>首页</span>
  </a>
  <a class="bottom-nav-item" href="/profile.html" id="nav-profile-link">
    <span class="bottom-nav-icon">&#x1F464;</span>
    <span>我的</span>
  </a>
</nav>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script>
(function () {
  'use strict';

  // ===== 导航栏渲染 =====
  function renderNav() {
    const actionsEl = document.getElementById('nav-actions');
    if (Auth.isLoggedIn()) {
      const user = Auth.getUser();
      actionsEl.innerHTML = `
        <span style="font-size:13px;color:var(--color-text-muted);">${user ? user.nickname : ''}</span>
        <button class="btn btn-ghost btn-sm" id="btn-logout">退出</button>
      `;
      document.getElementById('btn-logout').addEventListener('click', handleLogout);
    } else {
      actionsEl.innerHTML = `
        <a href="/login.html" class="btn btn-outline btn-sm">登录</a>
        <a href="/login.html?tab=register" class="btn btn-gold btn-sm">注册</a>
      `;
    }
  }

  // ===== 用户状态条 =====
  function renderUserStatus() {
    if (!Auth.isLoggedIn()) {
      document.getElementById('bbq-entry-status').textContent = '登录后保存进度';
      document.getElementById('home-level').textContent = '第1关';
      document.getElementById('home-score').textContent = '0';
      document.getElementById('home-coins').textContent = '0';
      return;
    }
    const user = Auth.getUser();
    if (!user) return;

    const bar = document.getElementById('user-status-bar');
    bar.style.display = 'flex';
    document.getElementById('status-name').textContent = user.nickname;

    // 尝试从 API 获取最新积分（可失败）
    API.users.me().then(data => {
      const bbq = data.bbq || {};
      const maxLevel = bbq.maxLevel || 1;
      const totalScore = bbq.totalScore || 0;
      const coins = (bbq.resources && bbq.resources.coins) || 0;

      document.getElementById('status-rank').innerHTML =
        `<span style="font-size:12px;color:var(--color-gold)">第 ${maxLevel} 关</span>`;
      document.getElementById('status-rating').textContent = `金币 ${coins}`;
      document.getElementById('bbq-entry-status').textContent = `继续第 ${maxLevel} 关 · 金币 ${coins}`;
      document.getElementById('home-level').textContent = `第${maxLevel}关`;
      document.getElementById('home-score').textContent = totalScore;
      document.getElementById('home-coins').textContent = coins;
      Auth.updateUser({ bbq });
    }).catch(() => {
      document.getElementById('status-rating').textContent = '';
    });
  }

  // ===== 退出登录 =====
  async function handleLogout() {
    try {
      await API.auth.logout();
    } catch (_) {}
    Auth.clearAuth();
    location.reload();
  }

  // ===== 游戏入口点击 =====
  function bindGameCards() {
    document.getElementById('card-bbq').addEventListener('click', () => {
      location.href = '/bbq/';
    });
  }

  // ===== 初始化 =====
  function init() {
    renderNav();
    renderUserStatus();
    bindGameCards();
  }

  init();
})();
</script>
</body>
</html>
