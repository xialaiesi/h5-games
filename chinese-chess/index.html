<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>中国象棋</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "STKaiti", "KaiTi", serif;
  color: #eee;
  overflow: hidden;
  touch-action: manipulation;
}

h1 {
  font-size: 28px;
  margin-bottom: 8px;
  font-weight: 400;
  letter-spacing: 6px;
  color: #e0c080;
}

.info-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 10px;
  font-size: 15px;
}

.player-tag {
  padding: 4px 16px;
  border-radius: 16px;
  transition: all 0.3s;
  letter-spacing: 2px;
}

.player-tag.red { color: #e04040; }
.player-tag.black { color: #ccc; }

.player-tag.active {
  background: rgba(224, 192, 128, 0.15);
  box-shadow: 0 0 10px rgba(224, 192, 128, 0.2);
}

#board-container { position: relative; touch-action: none; }

canvas {
  display: block;
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.btn-row {
  display: flex;
  gap: 12px;
  margin-top: 14px;
}

button {
  padding: 8px 22px;
  border: 1px solid rgba(224, 192, 128, 0.4);
  background: rgba(224, 192, 128, 0.1);
  color: #e0c080;
  font-size: 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 2px;
}

button:hover { background: rgba(224, 192, 128, 0.25); }
button:active { transform: scale(0.96); }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 10;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }

.modal {
  background: #16213e;
  border: 1px solid rgba(224, 192, 128, 0.3);
  border-radius: 16px;
  padding: 32px 48px;
  text-align: center;
  animation: popIn 0.3s ease;
}

@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal h2 {
  font-size: 24px;
  color: #e0c080;
  margin-bottom: 8px;
  font-weight: 400;
  letter-spacing: 2px;
}
.modal p { font-size: 15px; color: #aaa; margin-bottom: 20px; }
</style>
</head>
<body>

<h1>中 国 象 棋</h1>
<div class="info-bar">
  <span class="player-tag red active" id="ind-red">红方</span>
  <span style="color:#555">VS</span>
  <span class="player-tag black" id="ind-black">黑方</span>
</div>

<div id="board-container">
  <canvas id="board"></canvas>
</div>

<div class="btn-row">
  <button id="btn-undo">悔 棋</button>
  <button id="btn-restart">重 开</button>
  <button id="btn-mode">模式: 双人</button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-subtitle"></p>
    <button id="btn-modal-restart">再来一局</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
